<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digitally.ly | بحث سريع</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.11/dist/purify.min.js"></script>
<style>
:root{--bg:#f4f7fe;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--blue:#0a66ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui;line-height:1.8}
.search{width:min(760px,100%);margin:16px auto;background:#fff;border:1px solid var(--border);border-radius:18px;padding:8px}
.row{display:flex;gap:8px}.row input{flex:1;border:0;outline:0;font-size:17px;padding:12px}
.btn{background:#0a66ff;color:#fff;border:0;padding:11px 18px;border-radius:999px;font-weight:800;cursor:pointer}
.results{width:min(760px,100%);margin:16px auto;display:none}.results.show{display:block}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.body{padding:16px}.body pre{background:#0b1220;color:#dbeafe;padding:12px;border-radius:10px;overflow:auto;direction:ltr}
</style>
</head>
<body>
<div class="search">
<div class="row"><input id="q" placeholder="اكتب سؤالك..."><button class="btn" id="go">بحث</button></div>
</div>
<div class="results" id="res"><div class="card"><div class="body" id="body"></div></div></div>

<script>
const SYSTEM=`أنت محرك Digitally.ly. جاوب بالعربية منسق: خلاصة ثم عناوين ## و ### ونقاط.`;
async function fastSearch(query){
 if(!query.trim())return;
 const body=document.getElementById('body'); const res=document.getElementById('res');
 res.classList.add('show'); body.innerHTML='أبحث لك الآن...';
 const prompt=`${SYSTEM}\n\nسؤال: ${query}`;
 const url=`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&seed=${Date.now()}`;
 const controller=new AbortController(); setTimeout(()=>controller.abort(),15000);
 try{
  const r=await fetch(url,{signal:controller.signal});
  let text=await r.text();
  body.innerHTML=DOMPurify.sanitize(marked.parse(text));
 }catch(err){
  body.innerHTML=`فشل، <button onclick="location.reload()">إعادة المحاولة</button><br><small>${err.message}</small>`;
 }
}
document.getElementById('go').onclick=()=>fastSearch(document.getElementById('q').value);
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter')fastSearch(e.target.value)};
</script>
</body>
</html>
