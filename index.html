<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digitally.ly | محرك سريع ثابت</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.11/dist/purify.min.js"></script>
<style>
:root{--bg:#f4f7ff;--card:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--blue:#0a66ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui;line-height:1.8}
.nav{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}.logo{font-weight:900;color:var(--blue);text-decoration:none}
.hero{max-width:1100px;margin:0 auto;padding:36px 16px;text-align:center}.hero h1{font-size:2.2rem;margin:8px 0}.hero h1 span{color:var(--blue)}
.search{width:min(740px,100%);margin:18px auto;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.06);padding:8px}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1;border:0;outline:0;font-size:17px;padding:12px 8px;background:transparent}
.btn{background:var(--blue);color:#fff;border:0;padding:11px 18px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:8px}.chip{font-size:.82rem;padding:6px 12px;border-radius:999px;background:#eef4ff;border:1px solid #dbe7ff;cursor:pointer}
.results{width:min(740px,100%);margin:16px auto;display:none;text-align:right}.results.show{display:block}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:#fbfdff;font-weight:700}.head small{font-weight:400;color:var(--muted);margin-right:auto}
.body{padding:16px}.body h2{font-size:1.2rem;margin:14px 0 6px}.body h3{font-size:1.02rem;margin:12px 0 4px}.body ul,.body ol{margin:8px 18px 12px 0}.body li{margin:5px 0}.body pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;overflow:auto;direction:ltr;text-align:left}.body blockquote{border-right:3px solid var(--blue);background:#f0f6ff;padding:8px 12px;border-radius:8px;margin:10px 0}
.foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
.act{border:1px solid var(--border);background:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.82rem}.act.p{background:var(--blue);color:#fff;border-color:var(--blue)}
.load{display:flex;gap:6px;align-items:center;color:#6b7fa3;padding:10px}.d{width:6px;height:6px;background:var(--blue);border-radius:50%;animation:b 1.2s infinite}.d:nth-child(2){animation-delay:.15s}.d:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
@media(max-width:640px){.row{flex-wrap:wrap}.row input{flex:1 1 100%;text-align:center;order:2}#go{width:100%;order:3}}
</style>
</head>
<body>
<nav><div class="nav"><a class="logo" href="#">Digitally</a></div></nav>
<section class="hero">
<h1>محرك بحث <span>ثابت وسريع</span></h1>
<p>يعمل حتى مع الإنترنت الضعيف، بدون إلغاء الطلب.</p>
<div class="search">
<div class="row"><input id="q" placeholder="اكتب Hi أو أي سؤال..." autofocus><button class="btn" id="go">بحث</button></div>
<div class="chips"><button class="chip" data-q="مرحبا">مرحبا</button><button class="chip" data-q="كيف أبدأ متجر إلكتروني في ليبيا؟">متجر إلكتروني</button><button class="chip" data-q="شرح SEO للمبتدئين">SEO</button><button class="chip" data-q="خطة تسويق رقمي">خطة تسويق</button></div>
</div>
<div class="results" id="res"><div class="card"><div class="head"><span>🤖 Digitally AI</span><small id="tm"></small></div><div class="body" id="body"></div><div class="foot"><button class="act p" id="copy">نسخ الإجابة</button><button class="act" onclick="res.classList.remove('show')">إغلاق</button></div></div></div>
</section>

<script>
const SYSTEM=`أنت محرك Digitally.ly الذكي مثل جوجل. جاوب بالعربية منسق: ابدأ بخلاصة سريعة في اقتباس > ثم عناوين ## و ### ونقاط.`;
const q=document.getElementById('q'),go=document.getElementById('go'),res=document.getElementById('res'),body=document.getElementById('body'),tm=document.getElementById('tm');
let last='';
const quickReplies={
 'hi':'مرحبا 👋\n\n> أنا محرك Digitally الذكي، أساعدك في تصميم المواقع، المتاجر، والتسويق الرقمي في ليبيا.\n\n## كيف أساعدك؟\n- **تصميم مواقع** سريعة\n- **متاجر إلكترونية** مع دفع محلي\n- **SEO** لتصدر جوجل\n- **خطط تسويق** جاهزة\n\nاكتب سؤالك وسأجيب فورا داخل الموقع بدون خروج.',
 'hello':'Hello 👋 Welcome to Digitally AI!',
 'مرحبا':'مرحبا بك في Digitally.ly 👋\n\n> محرك بحث عام داخل موقعك، يجلب الإجابات من الذكاء الخارجي ويعرضها هنا بدون خروج.',
 'سلام':'وعليكم السلام ورحمة الله 👋 أهلا بك!'
};
async function search(query){
 if(!query.trim())return;
 const key=query.trim().toLowerCase();
 res.classList.add('show'); tm.textContent='...';
 if(quickReplies[key]){
   last=quickReplies[key];
   body.innerHTML=DOMPurify.sanitize(marked.parse(last));
   tm.textContent='رد فوري • بدون إنترنت';
   return;
 }
 body.innerHTML=`<div class=load><span class=d></span><span class=d></span><span class=d></span> أبحث لك الآن... لا يتم الإلغاء</div>`;
 const start=Date.now();
 async function tryGET(prompt){
   const url=`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`;
   const r=await fetch(url,{method:'GET',cache:'no-store'});
   if(!r.ok) throw new Error('GET '+r.status);
   return await r.text();
 }
 async function tryPOST(prompt){
   const r=await fetch('https://text.pollinations.ai/openai',{
     method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({model:'openai',messages:[{role:'system',content:SYSTEM},{role:'user',content:prompt}],stream:false})
   });
   const j=await r.json();
   return j.choices?.[0]?.message?.content||'';
 }
 const fullPrompt=`${SYSTEM}\n\nسؤال المستخدم: ${query}`;
 try{
   let answer=''; try{ answer=await tryGET(fullPrompt); }catch(e1){ answer=await tryPOST(query); }
   if(!answer || answer.length<5) throw new Error('رد فارغ');
   last=answer; body.innerHTML=DOMPurify.sanitize(marked.parse(answer));
   tm.textContent=`تم في ${((Date.now()-start)/1000).toFixed(1)}ث`;
 }catch(err){
   body.innerHTML=`<p style="color:#ef4444">حدث تأخير مؤقت</p><p><code>${err.message}</code></p><button class="act p" onclick="document.getElementById('go').click()">إعادة المحاولة</button>`;
   tm.textContent='خطأ شبكة';
 }
}
go.onclick=()=>search(q.value);
q.onkeydown=e=>{if(e.key==='Enter')search(q.value)};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.dataset.q;search(c.dataset.q)});
document.getElementById('copy').onclick=()=>{if(last)navigator.clipboard.writeText(last)};
</script>
</body>
</html>
