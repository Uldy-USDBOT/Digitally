<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digitally.ly | التحول الرقمي وحلول الأعمال في ليبيا</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root { --bg-soft-blue: #f1f8ff; --primary-blue: #0066cc; --text-dark: #333; --white: #ffffff; }
        *{box-sizing:border-box} body{font-family:'Segoe UI',Tahoma,sans-serif;margin:0;background:var(--bg-soft-blue);color:var(--text-dark);line-height:1.8}
        nav{background:#fff;position:sticky;top:0;z-index:1000;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:15px 0}
        .nav-container{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
        .logo{font-weight:800;color:var(--primary-blue);font-size:1.5rem;text-decoration:none}
        .nav-links{list-style:none;display:flex;gap:30px;margin:0;padding:0}
        .nav-links a{text-decoration:none;color:#777;font-weight:700}
        .hero{max-width:1100px;margin:0 auto;padding:80px 20px 40px;text-align:center}
        .hero h1{font-size:2.6rem} .hero h1 span{color:var(--primary-blue)}
        .btn-primary{background:var(--primary-blue);color:#fff;padding:13px 30px;border-radius:30px;border:0;cursor:pointer;font-weight:700}
        .ai-engine-wrap{width:min(720px,100%);margin:28px auto 0;background:#fff;border-radius:20px;padding:8px;box-shadow:0 12px 40px rgba(0,102,204,.12);border:1px solid #e3efff}
        .ai-search-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px}
        .ai-search-box input{flex:1 1 220px;min-width:0;border:0;outline:0;font-size:17px;padding:13px 10px;background:transparent}
        .ai-badge{background:#eef6ff;color:var(--primary-blue);font-size:.72rem;font-weight:800;padding:6px 10px;border-radius:999px}
        .ai-chip{background:var(--bg-soft-blue);border:1px solid #dbe9ff;padding:6px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;white-space:nowrap}
        .ai-answer{width:min(720px,100%);margin:18px auto 0;display:none;background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #e6efff;white-space:pre-wrap;text-align:right}
        .ai-answer.show{display:block}
        @media(max-width:640px){.ai-engine-wrap{width:calc(100% - 24px)}.ai-badge{width:100%;justify-content:center;order:1}.ai-search-box input{order:2;flex:1 1 100%;text-align:center}#searchBtn{order:3;width:100%}}
    </style>
</head>
<body>
<!-- ... نفس كود موقعك كامل مع محرك البحث ... -->
<section class="hero">
    <h1>موقعك أصبح <span>محرك بحث عام</span> مثل جوجل</h1>
    <div class="ai-engine-wrap">
        <div class="ai-search-box">
            <span class="ai-badge">✦ محرك بحث عام</span>
            <input id="searchInput" placeholder="اسأل أي شيء..." />
            <button class="btn-primary" id="searchBtn" style="padding:11px 20px;border-radius:999px">بحث</button>
        </div>
    <div id="answerBox" class="ai-answer"></div>
</section>
<script>
const SYSTEM_PROMPT=`أنت محرك بحث عام داخل موقع Digitally.ly مثل Google و Meta AI. تجيب على أي سؤال عام من معرفتك الخارجية.`;
const input=document.getElementById('searchInput'),btn=document.getElementById('searchBtn'),box=document.getElementById('answerBox');
async function doSearch(q){
 if(!q.trim())return; box.classList.add('show'); box.innerHTML='أبحث لك...';
 const res=await puter.ai.chat([{role:"system",content:SYSTEM_PROMPT},{role:"user",content:q}],{model:"gpt-4o-mini",stream:true});
 let full=""; box.textContent="";
 for await(const p of res){ if(p?.text){ full+=p.text; box.textContent=full; } }
 box.innerHTML=full.replace(/\n/g,"<br>");
}
btn.onclick=()=>doSearch(input.value); input.onkeydown=e=>{if(e.key==='Enter')doSearch(input.value)};
</script>
</body>
</html>
